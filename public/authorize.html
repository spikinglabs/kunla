<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Connect to Kunla</title>
  <script src="/theme.js"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="gate"><div class="gate-card" id="box"><p class="muted">Loading…</p></div></main>
  <script type="module">
    const box = document.getElementById('box');
    const q = new URLSearchParams(location.search);
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    // A connector added at /mcp/KEY is for one workspace: sign in with this browser's token for it.
    const wsKey = (() => { try { return new URL(q.get('resource') || '').pathname.match(/^\/mcp\/([A-Za-z][A-Za-z0-9]{1,9})\/?$/)?.[1]?.toUpperCase() ?? null; } catch { return null; } })();
    let token = null;
    try { token = localStorage.getItem('kunla.token'); } catch {}
    const whoIs = (t) => fetch('/api/me', { headers: { authorization: `Bearer ${t}` } }).then((r) => r.ok ? r.json() : null).catch(() => null);
    let other = null; // the workspace a pasted token belongs to, when it is the wrong one
    async function pickToken() {
      const candidates = [token];
      try { for (const sp of JSON.parse(localStorage.getItem('kunla.spaces') || '[]')) if (sp.url === location.origin) candidates.push(sp.token); } catch {}
      for (const t of [...new Set(candidates.filter(Boolean))]) {
        const me = await whoIs(t);
        if (me && (!wsKey || me.workspace?.key === wsKey)) { token = t; return me; }
        if (me && t === token) other = me.workspace?.name;
      }
      return null;
    }
    async function main() {
      const client = await fetch(`/oauth/client/${encodeURIComponent(q.get('client_id') || '')}`).then((r) => r.ok ? r.json() : null);
      if (!client) { box.innerHTML = '<h1>Unknown app</h1><p>This connection request is not valid. Try adding the connector again.</p>'; return; }
      let me = await pickToken();
      if (!me) {
        box.innerHTML = `<h1>Sign in to connect ${esc(client.name)}</h1>
          <p>Paste your personal Kunla token${wsKey ? ` for the workspace <b>${esc(wsKey)}</b>` : ''}.</p>
          ${other ? `<p class="warn">That token is for ${esc(other)}, not ${esc(wsKey)}.</p>` : ''}
          <form id="f" class="stack"><div class="field"><label for="tok">Token</label><input id="tok" name="token" type="password" required placeholder="kun_…"></div>
          <button class="primary" style="justify-content:center">Continue</button></form>`;
        document.getElementById('f').onsubmit = (e) => {
          e.preventDefault();
          token = new FormData(e.target).get('token').trim();
          // Only make it this browser's main token when no workspace was asked for.
          if (!wsKey) try { localStorage.setItem('kunla.token', token); } catch {}
          main();
        };
        return;
      }
      const defaultName = `${me.name}'s ${client.name}`;
      // One connector for several workspaces (KD-29): the other workspaces this browser is signed in to here.
      const mine = [{ token, me }];
      try {
        for (const sp of JSON.parse(localStorage.getItem('kunla.spaces') || '[]')) {
          if (sp.url !== location.origin || !sp.token || mine.some((x) => x.token === sp.token)) continue;
          const m = await whoIs(sp.token);
          if (m && m.kind === 'human' && m.workspace && !mine.some((x) => x.me.workspace?.key === m.workspace.key)) mine.push({ token: sp.token, me: m });
        }
      } catch {}
      const pick = mine.length > 1 ? `<fieldset class="field"><legend>Workspaces it may use</legend>
          ${mine.map((x, i) => `<label class="row" style="gap:8px"><input type="checkbox" name="ws" value="${i}" ${i === 0 ? 'checked disabled' : ''}>
            <span class="grow">${esc(x.me.workspace.name)} <span class="muted mono">${esc(x.me.workspace.key)}</span></span>
            ${i === 0 ? '<span class="muted">default</span>' : ''}</label>`).join('')}
          <p class="muted" style="font-size:13px">It joins each ticked workspace as its own agent. Every request acts in one workspace, ${esc(mine[0].me.workspace.name)} unless it names another, and you can remove it from one workspace without touching the others.</p></fieldset>` : '';
      box.innerHTML = `<h1>Connect ${esc(client.name)} to Kunla</h1>
        <p>It joins <b>${esc(me.workspace?.name ?? 'your workspace')}</b> as an agent you sponsor. It can read tasks, record work and submit work for review, all under its own name.</p>
        <form id="f" class="stack">${pick}<div class="field"><label for="nm">Name in Kunla</label><input id="nm" name="name" value="${esc(defaultName)}" required></div>
        <div class="row"><button class="primary">Allow</button><button type="button" class="ghost" id="deny">Cancel</button></div></form>`;
      document.getElementById('deny').onclick = () => {
        const u = new URL(q.get('redirect_uri')); u.searchParams.set('error', 'access_denied');
        if (q.get('state')) u.searchParams.set('state', q.get('state'));
        if (client.redirect_uris.includes(q.get('redirect_uri'))) location.href = u.toString();
      };
      document.getElementById('f').onsubmit = async (e) => {
        e.preventDefault();
        const r = await fetch('/oauth/approve', {
          method: 'POST',
          headers: { 'content-type': 'application/json', authorization: `Bearer ${token}` },
          body: JSON.stringify({
            client_id: q.get('client_id'), redirect_uri: q.get('redirect_uri'), state: q.get('state'),
            code_challenge: q.get('code_challenge'), code_challenge_method: q.get('code_challenge_method') || 'S256', resource: q.get('resource'),
            name: new FormData(e.target).get('name'), platform: /claude/i.test(client.name) ? 'claude-ai' : 'chat',
            grants: new FormData(e.target).getAll('ws').map(Number).filter((i) => i > 0).map((i) => mine[i].token),
          }),
        });
        const d = await r.json();
        if (!r.ok) { box.insertAdjacentHTML('beforeend', `<p class="warn">${esc(d.error)}</p>`); return; }
        location.href = d.redirect;
      };
    }
    main();
  </script>
</body>
</html>
