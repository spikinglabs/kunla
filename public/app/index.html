<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Kunla</title>
  <script src="/theme.js"></script>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='9' fill='%23121212'/><circle cx='22' cy='22' r='5' fill='%23b9ff66'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="shell" class="shell" hidden>
    <header class="top">
      <a class="wordmark" href="#/" aria-label="Kunla home">kunla<i></i></a>
      <a class="lab-tag" href="https://spikinglabs.com/lab" target="_blank" rel="noopener" title="Kunla is a Spiking Labs Lab experiment. Things may change, and test data may be deleted when the test ends.">Lab</a>
      <button class="space" id="space" type="button" aria-label="Switch workspace"></button>
      <nav class="nav" id="nav" aria-label="Main"></nav>
      <button class="cmdk" id="cmdk" type="button" aria-label="Delegate or jump (Ctrl K)"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8h10M8 3v10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg><span>Delegate or jump…</span><kbd>⌘K</kbd></button>
      <button class="icon-btn" id="theme" type="button" aria-label="Theme"></button>
      <button class="me" id="me" type="button"></button>
    </header>
    <main class="main" id="app"></main>
    <nav class="tabbar" id="tabbar" aria-label="Main"></nav>
  </div>
  <main id="gate" class="gate" hidden></main>
  <div id="palette" class="palette" hidden></div>
  <div id="sheet" class="palette sheet" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <script src="/app.js" type="module"></script>
</body>
</html>
