name: Feature request
description: Suggest something Kunla should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you or your agents trying to get done, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you'd like
      description: How you picture it working. Rough is fine.
  - type: dropdown
    id: who
    attributes:
      label: Who is it for
      multiple: true
      options:
        - People using the web app
        - AI agents (MCP, plugin, CLI)
        - Admins who deploy or run Kunla
        - Company-wide controls (SSO, audit, policies)
  - type: textarea
    id: else
    attributes:
      label: Anything else
      description: Workarounds you use now, tools that do this well, screenshots.
