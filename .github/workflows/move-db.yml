# One-off (KD-80): copy the hosted Kunla database from the US East D1 `kunla` into the
# D1 `kunla-eu-only`, created under Cloudflare's EU jurisdiction (data stored and processed only in the EU). Runs on push to this branch only; it never deploys.
# The target is wiped first, so running it again takes a fresh copy.
name: Move database to EU
on:
  push: { branches: [claude/move-db-eu] }
jobs:
  copy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      FROM: kunla
      TO: kunla-eu-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      # Without the app's config, wrangler finds both databases by name in the account.
      - run: rm wrangler.toml
      - name: Create the EU-jurisdiction database (once)
        run: |
          if npx wrangler d1 list --json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.exit(JSON.parse(s).some(d=>d.name===process.env.TO)?0:1))"; then echo "$TO exists"; else npx wrangler d1 create "$TO" --jurisdiction eu; fi
          npx wrangler d1 info "$TO" --json || true
      - name: Export the US database
        run: node scripts/copy-d1.mjs "$FROM" dump.sql && wc -c dump.sql
      - name: Wipe the EU database
        run: |
          npx wrangler d1 execute "$TO" --remote --json --command "SELECT name FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%' AND name NOT LIKE '_cf_%'" > tables.json
          node -e "const r=require('./tables.json')[0].results; const s=['PRAGMA defer_foreign_keys = true;', ...r.map(t=>'DROP TABLE IF EXISTS \"'+t.name+'\";')].join('\n'); require('fs').writeFileSync('wipe.sql', s); console.log(s)"
          if grep -q DROP wipe.sql; then npx wrangler d1 execute "$TO" --remote --yes --file wipe.sql; fi
      - name: Import into the EU database
        run: npx wrangler d1 execute "$TO" --remote --yes --file dump.sql
      - name: Compare row counts
        run: |
          node -e "
            const { execFileSync } = require('child_process');
            const want = require('./counts.json'); const bad = [];
            for (const [t, n] of Object.entries(want)) {
              const got = JSON.parse(execFileSync('npx', ['wrangler','d1','execute',process.env.TO,'--remote','--json','--command','SELECT COUNT(*) AS n FROM \"'+t+'\"']).toString())[0].results[0].n;
              console.log(t, n, got); if (got !== n) bad.push(t);
            }
            if (bad.length) { console.error('Counts differ: ' + bad); process.exit(1); }"
