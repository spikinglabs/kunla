# Deploys your copy of Kunla to your Cloudflare account. Runs on demand, or on every push to main if you
# set the repository variable KUNLA_AUTO_DEPLOY to "true". Needs secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID,
# and the repository variable KUNLA_D1_ID (from `wrangler d1 create kunla`) unless wrangler.toml already has the id.
# Optional secret KUNLA_SETUP_TOKEN: only someone who knows it can run first-time setup.
# Optional variable KUNLA_DOMAIN (e.g. kunla.example.com): serve Kunla on that hostname as a Workers custom
# domain. The domain's zone must be in the same Cloudflare account, and the API token needs Zone: Workers Routes
# Edit, Zone: DNS Edit and Zone: Zone Read for it.
# Optional variable KUNLA_USAGE_PING=on: send the daily anonymous usage ping (version and counts only; see the README).
# Optional variable KUNLA_COLLECT_PINGS=true: only on the Kunla that collects those pings.
# Optional variable KUNLA_PLACEMENT_REGION (e.g. aws:us-east-1): run the Worker next to that cloud region, where
# your D1 database lives, instead of letting Smart Placement find it. ENAM databases sit near aws:us-east-1,
# WEUR near aws:eu-west-1 or aws:eu-central-1.
# Optional variable KUNLA_ENV (e.g. staging): marks this copy as a test copy, with a small ribbon on every page and
# "env" in /api/health (KD-85). Defaults to staging on spikinglabs/kunla, whose main deploys kunla.lab.spikinglabs.com
# as staging; Kunla Cloud (kunla.app) is production and only takes releases. Set it to "production" to
# turn the ribbon off.
# The self-upgrade workflow (upgrade.yml) also calls this one to deploy the release it just merged.
name: Deploy
on:
  workflow_dispatch:
  push: { branches: [main] }
  workflow_call:
    inputs:
      ref:
        description: Commit to deploy
        type: string
        required: true
concurrency: { group: deploy, cancel-in-progress: false }
jobs:
  deploy:
    if: github.event_name != 'push' || vars.KUNLA_AUTO_DEPLOY == 'true'
    runs-on: ubuntu-latest
    env:
      KUNLA_SETUP_TOKEN: ${{ secrets.KUNLA_SETUP_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ inputs.ref || github.sha }}" }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - name: Use your D1 database
        if: vars.KUNLA_D1_ID != ''
        run: sed -i "s/REPLACE_WITH_YOUR_D1_ID/${{ vars.KUNLA_D1_ID }}/" wrangler.toml
      - name: Use your domain
        if: vars.KUNLA_DOMAIN != ''
        run: sed -i '/^compatibility_date/a routes = [{ pattern = "${{ vars.KUNLA_DOMAIN }}", custom_domain = true }]' wrangler.toml
      - name: Usage ping settings
        if: vars.KUNLA_USAGE_PING != '' || vars.KUNLA_COLLECT_PINGS != ''
        run: |
          [ -n "${{ vars.KUNLA_USAGE_PING }}" ] && sed -i '/^\[vars\]$/a KUNLA_USAGE_PING = "${{ vars.KUNLA_USAGE_PING }}"' wrangler.toml
          [ -n "${{ vars.KUNLA_COLLECT_PINGS }}" ] && sed -i '/^\[vars\]$/a KUNLA_COLLECT_PINGS = "${{ vars.KUNLA_COLLECT_PINGS }}"' wrangler.toml
          grep -A4 '^\[vars\]' wrangler.toml
      - name: Mark a test copy
        env:
          KUNLA_ENV: ${{ vars.KUNLA_ENV || (github.repository == 'spikinglabs/kunla' && 'staging') || '' }}
        if: env.KUNLA_ENV != '' && env.KUNLA_ENV != 'production'
        run: |
          sed -i "/^\[vars\]$/a KUNLA_ENV = \"$KUNLA_ENV\"" wrangler.toml
          label="$(printf '%s' "$KUNLA_ENV" | tr -cd 'A-Za-z0-9 _-' | sed 's/./\U&/')"
          ribbon='<div role="note" style="position:fixed;z-index:2147483647;left:50%;bottom:0;transform:translateX(-50%);padding:2px 10px;border-radius:6px 6px 0 0;background:#b45309;color:#fff;font:600 11px/1.6 system-ui,sans-serif;letter-spacing:.04em;pointer-events:none;opacity:.85">'"$label"' · '"$(git rev-parse --short HEAD)"'</div>'
          for f in public/index.html public/authorize.html; do sed -i "s|<body\([^>]*\)>|&\n$ribbon|" "$f"; done
          # A test copy stays out of search results (the page's canonical link already points at kunla.app).
          sed -i 's|<meta charset="utf-8">|&\n<meta name="robots" content="noindex, nofollow">|' public/index.html
          grep -c "$label ·" public/index.html
          grep '^KUNLA_ENV' wrangler.toml
      - name: Pin where the Worker runs
        if: vars.KUNLA_PLACEMENT_REGION != ''
        run: sed -i 's/^mode = "smart"$/region = "${{ vars.KUNLA_PLACEMENT_REGION }}"/' wrangler.toml
      - run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Protect first-time setup
        if: env.KUNLA_SETUP_TOKEN != ''
        run: printf '%s' "$KUNLA_SETUP_TOKEN" | npx wrangler secret put SETUP_TOKEN
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
