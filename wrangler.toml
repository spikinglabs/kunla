name = "kunla"
main = "src/index.ts"
compatibility_date = "2025-09-01"

# The web app is plain static files, served for free by Workers static assets.
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/mcp", "/mcp/*", "/oauth/*", "/.well-known/*", "/t/*", "/hooks/*", "/auth/*"]

# Run the Worker next to its D1 database instead of next to the visitor. A page load makes a few
# database round trips; across an ocean each one costs ~100 ms, next to the database ~1 ms.
# Smart Placement finds that spot by itself (it can take ~15 minutes after a deploy to settle).
# The deploy workflow swaps this for an explicit hint when the KUNLA_PLACEMENT_REGION variable is set.
[placement]
mode = "smart"

[[d1_databases]]
binding = "DB"
database_name = "kunla"
database_id = "REPLACE_WITH_YOUR_D1_ID"
migrations_dir = "migrations"

[vars]
# Minutes an AI's claim stays alive without a heartbeat.
LEASE_MINUTES = "30"
# Set a secret SETUP_TOKEN (wrangler secret put SETUP_TOKEN) so only you can run first-time setup.

# Start of each UTC day: wake agents in continuous mode that stopped on a daily budget.
[triggers]
crons = ["2 0 * * *"]
